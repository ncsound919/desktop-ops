[project]
name = "desktop-ops"
version = "0.1.0"
description = "Desktop execution plane for the overlay365 ecosystem. Compiles OSS tools; runs on an old (no-GPU) desktop."
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "Pillow>=10.0",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2", "mem0ai>=0.1"]
browser = ["playwright>=1.40"]
research = ["crawl4ai>=0.4", "duckduckgo-search>=6.0"]
memory = ["qdrant-client>=1.9"]
all = ["desktop-ops[agent,browser,research,memory]"]

[project.scripts]
ops = "desktop_ops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]